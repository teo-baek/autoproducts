[project]
name = "ezmerce-backend"
version = "0.2.0"
description = "ezmerce v2 backend (FastAPI + Supabase)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "supabase>=2.30",
    "pyjwt[crypto]>=2.13",
    "pydantic-settings>=2.14",
    "qrcode>=8.2",
    "pillow>=12.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]
notebook = [
    "ipykernel>=7.0",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pandas>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
